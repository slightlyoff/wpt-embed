  <body>

    <!-- 
    <div style="position: sticky; left: 10px; top: 10px;">
      <h2>Default</h2>
      <div id="x-scroller">
        <div id="wide"></div>
      </div>
    </div>

    <wpt-filmstrip 
        size="large" 
        interval="500ms" 
        waterfall="true" 
        connections="true" 
        breakdown="true"
        crux="inp lcp fcp cls"
        video="true" 
        gif="true">
      <wpt-test
        timeline="../out/240729_AiDcPE_4F2/runs/1/firstView/timeline.json"
        label="Dummy test with AVIF images and all data">
      </wpt-test>
    </wpt-filmstrip>

    <!-- Just connections and breakdown -->
    <wpt-filmstrip 
        filmstrip="false" 
        connections="true" 
        breakdown="true">
      <wpt-test
        timeline="../out/240729_AiDcPE_4F2/runs/1/firstView/timeline.json"
        label="Dummy test with AVIF images and all data">
      </wpt-test>
    </wpt-filmstrip>
    <wpt-filmstrip size="small" debug>
      <wpt-test
        timeline="../out/240612_AiDcR6_9Y0/runs/1/firstView/timeline.json"
        label="TEST">
        <a 
          href="https://www.webpagetest.org/results.php?test=240612_AiDcR6_9Y0"
          target="_new">BenefitsCal, first load</a>
      </wpt-test>
    </wpt-filmstrip> 

    <wpt-filmstrip 
      size="medium" 
      interval="60fps"
      connections="true"
      breakdown="true">
      <wpt-test
        timeline="../out/240612_AiDcR6_9Y0/runs/1/firstView/timeline.json"
        label="TEST">
        <a 
          href="https://www.webpagetest.org/results.php?test=240612_AiDcR6_9Y0"
          target="_new">BenefitsCal, first load</a>
      </wpt-test>
    </wpt-filmstrip> 
   
    <wpt-filmstrip size="small" interval="500ms">
      <wpt-test
        timeline="../out/240612_AiDcR6_9Y0/runs/1/firstView/timeline.json"
        label="BenefitsCal, first load, Pixel 5">
        <a 
          href="https://www.webpagetest.org/results.php?test=240612_AiDcR6_9Y0"
          target="_new">BenefitsCal, first load, Pixel 5</a>
      </wpt-test>
    </wpt-filmstrip>

    
    <wpt-filmstrip size="large" interval="100">
      <wpt-test
        timeline="../out/240612_AiDcH3_9XB/runs/3/repeatView/timeline.json"
        label="TEST">
        <a 
          href="https://www.webpagetest.org/video/compare.php?tests=240612_AiDcH3_9XB-r:3-c:0"
          target="_new">BenefitsCal, first load, run 3</a>
      </wpt-test>
    </wpt-filmstrip>

    <wpt-filmstrip 
      style="display: block; max-width: 80%; margin: auto;"
      size="small"
      interval="500ms"
      breakdown="true"
      id="pair-container">
      <wpt-test
        label="First View"
        timeline="../out/240612_AiDcH3_9XB/runs/3/firstView/timeline.json">
        <a 
          href="https://www.webpagetest.org/video/compare.php?tests=240612_AiDcH3_9XB-r:3-c:0"
          target="_new">BenefitsCal, first view</a>
      </wpt-test>
      <wpt-test
        label="Repeat View"
        timeline="../out/240612_AiDcH3_9XB/runs/3/repeatView/timeline.json">
        <a 
          href="https://www.webpagetest.org/video/compare.php?tests=240612_AiDcH3_9XB-r:3-c:1"
          target="_new">repeat view</a>
      </wpt-test>
      <a 
        href="https://www.webpagetest.org/video/compare.php?tests=240612_AiDcH3_9XB-r:3-c:0,240612_AiDcH3_9XB-r:3-c:1"
        target="_new">,side-by-side view</a>
    </wpt-filmstrip>


    <script>
      let pc = document.getElementById("pair-container");
      let last = () => {
        return pc.querySelector("wpt-test:last-of-type");
      }

      function removeLast() {
        last().remove();
      }

      function cloneLast() {
        let clone = last().cloneNode(true);
        pc.appendChild(clone);
      }

      function changeInterval() {
        pc.setAttribute('interval', '1000ms');
      }
    </script>
    <button onclick="removeLast();">
      remove last
    </button>
    <button onclick="cloneLast();">
      clone last
    </button> 
    <button onclick="changeInterval();">
      change interval
    </button> 

  </body>
</html>
